name: Flutter CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий на виртуальный сервер GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем стабильную версию Java (нужна для сборки под Android)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Устанавливаем Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Использует актуальную стабильную версию
          channel: 'stable'
          cache: true

      # 4. Проверяем версию Flutter
      - name: Install dependencies
        run: flutter pub get

      # 5. Запускаем анализатор кода на наличие ошибок
      - name: Run Flutter analyze
        run: flutter analyze

      # 6. Собираем веб-версию (самый простой способ проверить сборку на Linux-сервере)
      - name: Build Web App
        run: flutter build web --release